# Unquoted literal values. Credentials can be provisioned with terra-network.conf
# on the FAT partition; that file is consumed on boot. No shared default password.
# WIFI_MODE=fallback tries saved Wi-Fi, then holds the hotspot until terra-wifi-retry.
# WIFI_CONNECT_TIMEOUT and WIFI_RETRY_TIMEOUT are seconds. Edit them only here.
WIFI_MODE=fallback
HOTSPOT_COUNTRY=US
HOTSPOT_SSID=
HOTSPOT_PASSPHRASE=
WIFI_CONNECT_TIMEOUT=30
WIFI_RETRY_TIMEOUT=15
