# No password is shipped: pi's shadow field is *. PasswordAuthentication is
# left unset on purpose. OpenSSH's default is yes, so a password Raspberry Pi
# Imager writes with chpasswd can log in. When Imager also installs a public
# key it appends "PasswordAuthentication no" to sshd_config, and that is the
# first explicit setting because this file does not set the option. A value
# here would be included first and would ignore that append.
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
UsePAM yes
